name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build dotnet/StokerPluginSdk.slnx -c Release
      - run: dotnet test --project dotnet/tests/Stoker.Plugins.Registry.Tests/Stoker.Plugins.Registry.Tests.csproj -c Release --no-build
      - run: dotnet pack dotnet/StokerPluginSdk.slnx -c Release --no-build -o dist/nuget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget
          path: dist/nuget/*.nupkg

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The example, with the cl/rc helper, both architectures
        shell: pwsh
        run: |
          ./native/build/Build-HookPlugin.ps1 -Source native/examples/filename_redirect.cpp -Name filename_redirect -Platform x64 -Out build/x64
          ./native/build/Build-HookPlugin.ps1 -Source native/examples/filename_redirect.cpp -Name filename_redirect -Platform Win32 -Out build/x86
      - name: The release zip
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -SkipPack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk
          path: dist/stoker-plugin-sdk-*

  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The headers under g++, as a Linux plugin builds against them
        run: |
          cat > /tmp/probe.cpp <<'EOF'
          #include "stoker/plugin_support.h"
          STOKER_PLUGIN_MANIFEST(R"json({"manifestVersion":1,"id":"org.example.probe","name":"Probe","type":"hook","version":"1.0.0","abi":1})json");
          STOKER_HOOK_PLUGIN_ENTRY int STOKER_HOOK_CALL stoker_hook_plugin_init(const stoker_hook_host_v1* host) { return stoker::plugin::Accept(host) ? STOKER_HOOK_OK : 1; }
          EOF
          g++ -std=c++20 -shared -fPIC -fvisibility=hidden -Wall -Wextra -O2 -Inative/include /tmp/probe.cpp -o /tmp/probe.so
          readelf -S /tmp/probe.so | grep -q '\.stkmeta'
