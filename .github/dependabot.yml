# Keeps the workflows' pinned action commits and the .NET packages current, as pull requests to review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /dotnet
    schedule:
      interval: weekly
    ignore:
      # From 9.0, JsonSchema.Net's binaries come under the Open Source Maintenance Fee EULA, not the MIT licence alone.
      - dependency-name: JsonSchema.Net
        versions: ['>= 9']
